<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#12221A" />
  <title>SAINTE — OFFLINE</title>
  <style>
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; background: #0C1712; color: #F6F8F7; font-family: "Neue Haas Grotesk", Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; gap: 24px; }
    .label { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; color: #A7E9BC; font-weight: 500; }
    .display { font-weight: 800; font-size: 56px; letter-spacing: -0.04em; line-height: 0.92; text-transform: uppercase; color: #F6F8F7; }
    .body { font-size: 14px; line-height: 1.5; color: #D9FBD9; max-width: 420px; }
    .gel { display: inline-block; padding: 14px 28px; border-radius: 9999px; background: linear-gradient(180deg, #E6FFE8 0%, #A7E9BC 100%); color: #0C1712; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; font-size: 11px; box-shadow: 0 8px 18px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.3) inset; cursor: pointer; border: 0; text-decoration: none; }
    .orb { width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(120% 100% at 30% 20%, #E6FFE8, #A7E9BC 70%, #1F3E2D); box-shadow: 0 0 32px rgba(199,255,62,0.32), 0 16px 28px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.2) inset; }
    .signal-rule { width: 64px; height: 2px; background: #C7FF3E; box-shadow: 0 0 12px rgba(199,255,62,0.32); border-radius: 1px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="orb" aria-hidden="true"></div>
    <div class="label">SAINTE / OFFLINE</div>
    <div class="display">No Signal</div>
    <div class="body">You're between transmissions. Reconnect and the network resumes — your bag, streak, and drops are held.</div>
    <div class="signal-rule" aria-hidden="true"></div>
    <button class="gel" onclick="location.reload()">RECONNECT</button>
  </div>
</body>
</html>
